services:
  postgres:
    image: postgres:16-alpine
    container_name: project_mgmt_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: project_mgmt_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: project_mgmt_backend
    restart: always
    environment:
      PORT: 8000
      NODE_ENV: production
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@postgres:5432/project_mgmt_db
      JWT_SECRET: super-secret-key-change-this-in-production-min-32-chars
      JWT_EXPIRES_IN: 86400
      CORS_ORIGIN: "http://localhost:5173,http://localhost:3000,*"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
